version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: r1_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: post_flow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: r1_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: r1_web
    command: uvicorn settings.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    environment:
      - DB_NAME=post_flow_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery:
    build: .
    container_name: r1_celery
    command: celery -A settings worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_NAME=post_flow_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: r1_celery_beat
    command: celery -A settings beat -l info
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - web

  nginx:
    image: nginx:alpine
    container_name: r1_nginx
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - web

volumes:
  postgres_data:
